# Nginx reverse proxy برای ربات Peech
# این فایل رو به /etc/nginx/sites-available/peech-bot کپی کن
# سپس: sudo ln -s /etc/nginx/sites-available/peech-bot /etc/nginx/sites-enabled/
# و certbot رو برای SSL اجرا کن: sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;

    # certbot این بلاک رو به HTTPS redirect می‌کنه
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # مسیرهای SSL (certbot اینا رو خودکار پر می‌کنه)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # فقط endpoint های لازم رو expose کن
    location /webhook/payment {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # بقیه درخواست‌ها رو رد کن
    location / {
        return 404;
    }
}
